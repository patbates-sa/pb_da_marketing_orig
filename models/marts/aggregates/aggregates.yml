version: 2

models:

  - name: cost_per_engaged_user
    description: Cost per engaged user on the website, joining engagement data with ad spend
    columns:
      - name: user_id
        description: Primary key - unique user identifier
        tests:
          - unique
          - not_null
      - name: total_engagement
        description: Sum of all engagement activity for the user
      - name: total_ad_spend
        description: Total advertising spend for the user
      - name: cost_per_engaged_user
        description: Calculated cost per unit of engagement (ad spend / engagement)

  - name: agg_campaign_customer_contacts
    description: Aggregated view of campaign-to-customer contacts based on tier matching
    columns:
      - name: contact_key
        description: Surrogate primary key (campaign_key + email_address)
        tests:
          - unique
          - not_null
      - name: campaign_name
        description: Name of the marketing campaign
      - name: campaign_owner
        description: Owner responsible for the campaign
      - name: customer_name
        description: Name of the customer contact
      - name: customer_region
        description: Geographic region of the customer
      - name: tier_name
        description: Tier classification linking campaign to customer
      - name: email_address
        description: Customer email address for contact
      - name: phone_number
        description: Customer phone number for contact
