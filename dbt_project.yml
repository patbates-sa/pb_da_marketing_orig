# Name of the project and initial config info
name: "da_marketing"
version: "1.0.0"
dbt-cloud:
  project-id: 70437463662272
  account-host: "tr995.us1.dbt.com"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "analytics"

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# dbt-project-evaluator configuration
vars:
  dbt_project_evaluator:
    staging_folder_name: "0_staging"
    intermediate_folder_name: "1_intermediate"
    marts_folder_name: "2_marts"
    # Exclude upstream cross-project models from evaluation
    exclude_packages:
      - "data_engineering"
      - "da_sales"
    # Add agg_ as accepted prefix for marts models
    marts_prefixes:
      - "dim_"
      - "fct_"
      - "agg_"

models:
  dbt_project_evaluator:
    +docs:
      show: false
    marts:
      structure:
        # Disable test directories check - we use _docs/ folder pattern
        fct_test_directories:
          +enabled: false